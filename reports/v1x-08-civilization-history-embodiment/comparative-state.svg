    <text x="330" y="330" fill="#f2f4f8" font-family="system-ui,sans-serif" font-size="15">s-beta · ACTIVE · pop 500</text>
    <text x="190" y="180" fill="#a9d6ff" font-family="system-ui,sans-serif" font-size="13">active infrastructure / trade cue</text>
    <text x="24" y="385" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="13">FOUNDING ×2 · INFRASTRUCTURE_BUILT · TRADE_EXPANSION</text>
  </g>

  <g transform="translate(630,112)">
    <rect width="530" height="430" rx="12" fill="#151a24" stroke="#4a5568"/>
