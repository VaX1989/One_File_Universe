    <text x="24" y="66" fill="#aab2c0" font-family="system-ui,sans-serif" font-size="14">4 structured history proposals</text>
    <line x1="155" y1="205" x2="380" y2="280" stroke="#79c2ff" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
    <circle cx="155" cy="205" r="38" fill="#7bd88f"/>
    <circle cx="380" cy="280" r="25" fill="#7bd88f"/>
