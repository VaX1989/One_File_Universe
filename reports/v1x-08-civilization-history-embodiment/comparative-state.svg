  <text x="40" y="584" fill="#aab2c0" font-family="system-ui,sans-serif" font-size="14">Source-event linkage: ev-found-alpha, ev-found-beta, ev-infra, ev-trade, ev-migration, ev-conflict, ev-abandon.</text>
  <text x="40" y="610" fill="#aab2c0" font-family="system-ui,sans-serif" font-size="14">The flat fixture field “events: fake-flat-event” is intentionally ignored; only structured history.proposals drives historical traces.</text>
