    <path d="M132 182 L178 228 M178 182 L132 228" stroke="#d38b8b" stroke-width="7"/>
    <circle cx="380" cy="280" r="30" fill="#7bd88f"/>
    <text x="88" y="265" fill="#f2f4f8" font-family="system-ui,sans-serif" font-size="15">s-alpha · ABANDONED · pop 3200</text>
