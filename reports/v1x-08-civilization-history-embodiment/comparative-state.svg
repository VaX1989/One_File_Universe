<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">V1X-08 causal civilization history comparative witness</title>
  <desc id="desc">Fixture-only schematic comparison. Before: two active settlements and an active corridor with four structured history traces. After: settlement alpha is abandoned, the corridor is ruined, and migration, conflict, and abandonment traces are added. No geometry or history shown here is canonical evidence.</desc>
  <rect width="1200" height="640" fill="#0b0e14"/>
  <text x="40" y="48" fill="#f2f4f8" font-family="system-ui,sans-serif" font-size="26" font-weight="700">V1X-08 — causal history → present-state visual witness</text>
  <text x="40" y="78" fill="#aab2c0" font-family="system-ui,sans-serif" font-size="15">MODEL_DERIVED_SIMULATION fixture → PRESENTATION_ONLY schematic • NOT CANONICAL • NOT A SCIENTIFIC MEASUREMENT</text>

  <g transform="translate(40,112)">
    <rect width="530" height="430" rx="12" fill="#151a24" stroke="#4a5568"/>
