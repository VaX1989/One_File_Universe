    - deterministic numeric semantic amendments
    - Universe Identity semantic amendments
    - Canonical Address format/version amendments
    - temporal total-order/live-admission amendments
    - authority taxonomy amendments
    - breaking C ABI version decisions
    - open-standard stable-version governance
    - convergence merge ownership

  convergence_train_rule: >-
    Do not continuously merge half-integrated lane work. Each writer publishes a coherent evidence-bound handoff.
    The control owner integrates periodic convergence candidates in dependency order, runs cumulative certification,
    then opens the next epoch only from a certified exact SHA/tree.

registry_completion_rule: >-
  A prompt is considered defined only when its lane record plus GLOBAL_EXECUTION_CONSTITUTION provide role,
  activation gate, authority, ownership, required reads where applicable, execution mission, evidence expectations
  and a terminal disposition. Future changes to these prompts must version this registry and preserve historical
  registry identity so old lane handoffs remain interpretable.