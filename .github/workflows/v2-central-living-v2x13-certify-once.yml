name: V2 Central Living V2X13 Certify Once

on:
  push:
    branches:
      - integration/v2x-supreme-total-convergence-2026-09-07
    paths:
      - .github/workflows/v2-central-living-v2x13-certify-once.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/v2x-supreme-total-convergence-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Static and baseline validation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/rendering/v1/living-v2x13-bridge.js
          node --check tests/v2x-convergence/living-v2x13-pixel-binding.mjs
          npm test
          node tests/render-platform/run-render-platform-convergence-tests.mjs
          node tests/render-platform/run-render-platform-tests.mjs
          node tests/render-platform/run-render-platform-depth-tests.mjs
      - name: Build exact real artifact
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-ofu-rendering-v09.mjs
      - name: Install governed Chromium runtime
        shell: bash
        run: npx playwright install --with-deps chromium
      - name: Real-browser Living V2X13 source-to-pixel witness
        shell: bash
        run: node tests/v2x-convergence/living-v2x13-pixel-binding.mjs
      - name: Progressive RELEASE conformance exact source
        shell: bash
        run: node tools/extensions/conformance.mjs RELEASE --exact
