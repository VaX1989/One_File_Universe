name: V1.1 World Material Depth
on:
  push:
    branches:
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/materials/reference-properties.js'
      - 'src/domains/v1/convergence/material-reference-context.js'
      - 'tests/v1/materials/reference-properties.mjs'
      - 'config/components/v11-material-reference-depth.json'
      - '.github/workflows/v11-world-material-depth.yml'
jobs:
  material-reference-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Syntax
        run: |
          node --check src/domains/v1/materials/reference-properties.js
          node --check src/domains/v1/convergence/material-reference-context.js
          node --check tests/v1/materials/reference-properties.mjs
      - name: Material reference properties oracle
        run: node tests/v1/materials/reference-properties.mjs
      - name: Live component graph integrity
        run: node tests/extensions/components.mjs
