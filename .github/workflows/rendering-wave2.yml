name: Rendering Wave 2 Research

on:
  push:
    branches:
      - research/rendering-p5-vertical-slice
  pull_request:

concurrency:
  group: rendering-wave2-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Frozen Foundation and P1-P5 regression
        run: |
          node tools/validate-foundation.mjs
          node tests/run-node-tests.mjs
          node tests/p1/portable-save-size.mjs
          npm run test:p2
          node tools/p3-evidence.mjs
          python3 tools/p3_spatial_oracle.py
          node tests/p4/run-p4-tests.mjs
          node tests/p4/semantic-closure-tests.mjs
          node tests/p4/archive-lineage-tests.mjs
          node tests/p4/checkpoint-authority-tests.mjs
          node tests/integration/p2-p4-contract-tests.mjs
          node tests/integration/p3-p4-contract-tests.mjs
          node tests/p5/run-p5-conformance.mjs
          node tests/integration/p3-p5-contract-tests.mjs
      - name: Rendering Wave 2 node evidence
        shell: bash
        run: |
          mkdir -p dist/evidence/rendering-wave2
          node tests/rendering/run-wave2-tests.mjs | tee dist/evidence/rendering-wave2/node.json
      - name: Build exact artifact twice
        shell: bash
        run: |
          node tools/build-rendering-wave2.mjs > /tmp/render-build-1.json
          cp dist/One_File_Universe_Rendering_Wave2.html /tmp/render-wave2-first.html
          cp dist/rendering-wave2-build.json /tmp/render-wave2-manifest-first.json
          node tools/build-rendering-wave2.mjs > /tmp/render-build-2.json
          cmp /tmp/render-wave2-first.html dist/One_File_Universe_Rendering_Wave2.html
          cmp /tmp/render-wave2-manifest-first.json dist/rendering-wave2-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: rendering-wave2-build-${{ env.OFU_SOURCE_SHA }}
          path: |
            dist/One_File_Universe_Rendering_Wave2.html
            dist/rendering-wave2-build.json
            dist/evidence/rendering-wave2/node.json

  browser-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: node tools/build-rendering-wave2.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise file URL, terrain and non-interference
        run: node tests/rendering/browser-wave2.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-wave2-linux-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/rendering-wave2/

  browser-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: node tools/build-rendering-wave2.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - name: Exercise file URL, terrain and non-interference
        run: node tests/rendering/browser-wave2.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-wave2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/rendering-wave2/

  seal:
    if: ${{ always() }}
    needs: [exact-head, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Wave 2 gates
        shell: bash
        run: |
          test '${{ needs.exact-head.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: rendering-wave2-*-${{ env.OFU_SOURCE_SHA }}
          path: evidence
          merge-multiple: true
      - name: Require five browser witnesses and one canonical result
        run: node tests/rendering/seal-evidence.mjs evidence
