name: V1.1 World Civilization Representatives
on:
  push:
    branches:
      - automation/ofu-world-civilization-representatives-2026-09-06
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/civilization/individuals.js'
      - 'tests/v1/civilization/individuals.mjs'
      - 'config/components/v11-civilization-representatives.json'
      - 'src/domains/v1/convergence/world-context.js'
      - '.github/workflows/v11-world-civilization-representatives.yml'

permissions:
  contents: read

concurrency:
  group: v11-world-civilization-representatives-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  civilization-representatives:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/civilization/individuals.js
          node --check tests/v1/civilization/individuals.mjs
      - name: Representative oracle
        run: node tests/v1/civilization/individuals.mjs
      - name: Component descriptor integration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {planComponents} from './tools/extensions/components.mjs';
          const actual=JSON.parse(fs.readFileSync('config/components/v11-civilization-representatives.json','utf8')).components[0];
          const dep=(id,source)=>({id,version:'1.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source,dependencies:[],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:[id]});
          const plan=planComponents([
            dep('v1.civilization.runtime','src/domains/v1/civilization/runtime.js'),
            dep('v1.ecology.causal-niche','src/domains/v1/ecology/causal-niche.js'),
            actual
          ]);
          if(!plan.some(x=>x.id==='v1.civilization.representatives'))throw new Error('civilization representative component missing');
          console.log(JSON.stringify({status:'PASS',component:'v1.civilization.representatives',planned:plan.length}));
          NODE
