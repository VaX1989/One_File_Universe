name: V1.1 World Local Biogeography
on:
  pull_request:
    paths:
      - 'src/domains/v1/ecology/biogeography-context.js'
      - 'tests/v1/ecology/biogeography-context.mjs'
      - 'config/components/v11-local-biogeography.json'
      - '.github/workflows/v11-world-local-biogeography.yml'
  workflow_dispatch:
jobs:
  lane-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact source
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Syntax
        run: node --check src/domains/v1/ecology/biogeography-context.js
      - name: Existing causal-niche regression
        run: node tests/v1/ecology/causal-niche.mjs
      - name: Local biogeography oracle
        run: node tests/v1/ecology/biogeography-context.mjs
      - name: Component integrity
        run: node tests/extensions/components.mjs
      - name: Workflow reproducibility
        run: node tests/foundation/workflow-reproducibility.mjs
