name: V1.1 World Molecular Reference Mass
on:
  push:
    branches:
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/molecular/reference-mass.js'
      - 'tests/v1/molecular/reference-mass.mjs'
      - 'config/components/v11-molecular-reference-mass.json'
      - '.github/workflows/v11-world-molecular-reference-mass.yml'
jobs:
  molecular-reference-mass:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Syntax
        run: |
          node --check src/domains/v1/molecular/reference-mass.js
          node --check tests/v1/molecular/reference-mass.mjs
      - name: Existing material reference oracle
        run: node tests/v1/materials/reference-properties.mjs
      - name: Molecular reference mass oracle
        run: node tests/v1/molecular/reference-mass.mjs
      - name: Live component graph integrity
        run: node tests/extensions/components.mjs
