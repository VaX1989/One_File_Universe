name: Rendering Production

on:
  push:
    branches:
      - feature/rendering-hierarchical-planet-integration
      - feature/rendering-p1-p6-production
      - integration/rendering-product-v0.6
      - feature/product-polish-v0.7
      - integration/product-evolution-v0.8
      - feature/v08-explore-navigation
      - feature/v08-rendering-camera
      - feature/v08-inspector-product
      - feature/v08-mobile-interaction
      - feature/v08-lab-technical
      - feature/v08-founder-visual-closure
      - main
  pull_request:
    branches: [main]

concurrency:
  group: rendering-production-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Product v0.8 composition and lane contracts
        run: |
          node tests/rendering/vertex-array-ownership.mjs
          node tests/rendering/local-surface-ray-oracle.mjs
          node tests/rendering/dual-artifact-seal.mjs
          node tests/product/v08-parallel-seams.mjs
          node tests/product/v08-inspector-product.mjs
          node tests/product/v08-lab-technical.mjs
          node tests/product/v08-mobile-interaction.mjs
      - name: Founder visual framing mathematics
        run: node tests/rendering/v08-camera-framing.mjs
      - name: Frozen Foundation and P1-P6 regression
        run: |
          node tools/validate-foundation.mjs
          node tests/governance/adr-hygiene.mjs
          node tests/run-node-tests.mjs
          node tests/p1/portable-save-size.mjs
          npm run test:p2
          node tools/p3-evidence.mjs
          python3 tools/p3_spatial_oracle.py
          node tests/p4/run-p4-tests.mjs
          node tests/p4/semantic-closure-tests.mjs
          node tests/p4/archive-lineage-tests.mjs
          node tests/p4/checkpoint-authority-tests.mjs
          node tests/integration/p2-p4-contract-tests.mjs
          node tests/integration/p3-p4-contract-tests.mjs
          node tests/p5/run-p5-conformance.mjs
          node tests/integration/p3-p5-contract-tests.mjs
          node tests/integration/p4-p5-static-binding-tests.mjs
          node tests/p5-environment-v2/run-environment-v2-conformance.mjs
          node tests/p5-environment-v2/worker-environment-v2.mjs
          python3 tools/p5_environment_v2_oracle.py
          node tests/p6/environment-state-conformance.mjs
          node tests/p6/authority-identity-adversarial.mjs
          node tests/p6/run-p6-v1.mjs
          node tests/p6/golden-v1.mjs
          node tests/p6/save-compatibility.mjs
          node tests/p6/worker-order.mjs
          node --expose-gc tests/p6/working-set.mjs
          python3 tools/p6_oracle.py
      - name: Rendering production node certification
        shell: bash
        run: |
          mkdir -p dist/evidence/rendering-production
          node tests/rendering/run-production-tests.mjs | tee dist/evidence/rendering-production/node.json
      - name: Reproducible foundation and full Wave IV single files
        shell: bash
        run: |
          node tools/build-ofu-rendering-v08.mjs > /tmp/render-build-1.json
          cp dist/One_File_Universe.html /tmp/render-first.html
          cp dist/rendering-build-manifest.json /tmp/render-manifest-first.json
          node tools/build-ofu-rendering-v08.mjs > /tmp/render-build-2.json
          cmp /tmp/render-first.html dist/One_File_Universe.html
          cmp /tmp/render-manifest-first.json dist/rendering-build-manifest.json
          test "$(grep -Eoc '(src|href)=["'\'']https?://' dist/One_File_Universe.html)" -eq 0
          grep -q "connect-src 'none'" dist/One_File_Universe.html
          grep -q 'v08-product-template-fragments-3' dist/rendering-build-manifest.json
          mkdir -p dist/foundation
          cp dist/One_File_Universe.html dist/foundation/One_File_Universe-foundation.html
          cp dist/rendering-build-manifest.json dist/foundation/rendering-foundation-manifest.json
          node tools/build-ofu-rendering-v09.mjs > /tmp/full-build-1.json
          cp dist/One_File_Universe.html /tmp/full-first.html
          cp dist/rendering-build-manifest.json /tmp/full-manifest-first.json
          node tools/build-ofu-rendering-v09.mjs > /tmp/full-build-2.json
          cmp /tmp/full-first.html dist/One_File_Universe.html
          cmp /tmp/full-manifest-first.json dist/rendering-build-manifest.json
          grep -q 'FRUSTUM_GROUND_FOOTPRINT_BOUNDED' dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-vertical-slice-3' dist/rendering-build-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rendering-production-build-${{ env.OFU_SOURCE_SHA }}
          path: |
            dist/One_File_Universe.html
            dist/rendering-build-manifest.json
            dist/evidence/rendering-production/node.json
            dist/foundation/

  browser-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-rendering-v08.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Direct file navigation, performance and non-interference
        run: node tests/rendering/browser-production.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
      - name: Rendering Product v0.6 target switching and canonical witnesses
        run: node tests/rendering/browser-product-v06.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
      - name: Product Polish v0.7 accessibility and responsive regression
        run: node tests/rendering/browser-product-v07.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
      - name: Product v0.8 Explore selection and navigation
        run: node tests/product/browser-v08-explore-navigation.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
      - name: Product v0.8 continue exploring across systems
        run: node tests/product/browser-v08-system-continuation.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
      - name: Product v0.8 integrated experience
        run: node tests/product/browser-v08-integrated-experience.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
      - name: Build full Wave IV product for renderer-specific visual closure
        run: node tools/build-ofu-rendering-v09.mjs
      - name: Founder visual settled camera and framebuffer closure
        run: node tests/product/browser-v08-settled-visual-closure.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rendering-production-linux-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/rendering-production/

  browser-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-rendering-v08.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - name: Direct file navigation and non-interference
        run: node tests/rendering/browser-production.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
      - name: Rendering Product v0.6 target switching and canonical witnesses
        run: node tests/rendering/browser-product-v06.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
      - name: Product Polish v0.7 accessibility and responsive regression
        run: node tests/rendering/browser-product-v07.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
      - name: Product v0.8 Explore selection and navigation
        run: node tests/product/browser-v08-explore-navigation.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
      - name: Product v0.8 continue exploring across systems
        run: node tests/product/browser-v08-system-continuation.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
      - name: Product v0.8 integrated experience
        run: node tests/product/browser-v08-integrated-experience.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
      - name: Build full Wave IV product for renderer-specific visual closure
        run: node tools/build-ofu-rendering-v09.mjs
      - name: Founder visual settled camera and framebuffer closure
        run: node tests/product/browser-v08-settled-visual-closure.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rendering-production-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/rendering-production/

  seal:
    name: rendering-production-seal
    if: ${{ always() }}
    needs: [exact-head, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require all production gates
        shell: bash
        run: |
          test '${{ needs.exact-head.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rendering-production-*-${{ env.OFU_SOURCE_SHA }}
          path: evidence
          merge-multiple: true
      - name: Exact cross-runtime production seal
        run: node tests/rendering/seal-production-evidence.mjs evidence
