name: P6 v1 Conformance

on:
  push:
    branches: [feature/p6-biosphere-evolution-v1, main, 'development/v1.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: p6-v1-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.phase-gate.outputs.run }}
      adapter_status: ${{ steps.phase-gate.outputs.adapter_status }}
      fail_closed: ${{ steps.phase-gate.outputs.fail_closed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: '${{ env.OFU_SOURCE_SHA }}'
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Route historical P6 evidence
        id: phase-gate
        shell: bash
        env:
          OFU_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          OFU_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci/phase-gate.mjs --phases P6 --base-ref "$OFU_BASE_REF" --base-sha "$OFU_BASE_SHA" --head-sha "$OFU_SOURCE_SHA"
  node:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with: {ref: '${{ env.OFU_SOURCE_SHA }}'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # Node 24 runtime
        with: {python-version: '3.13.15'}
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Foundation
        run: node tools/validate-foundation.mjs && node tests/governance/adr-hygiene.mjs
      - name: P1
        run: node tests/run-node-tests.mjs && node tests/p1/portable-save-size.mjs
      - name: P2
        run: npm run test:p2
      - name: P3
        run: node tools/p3-evidence.mjs && python3 tools/p3_spatial_oracle.py
      - name: P4
        run: node tests/p4/run-p4-tests.mjs && node tests/p4/semantic-closure-tests.mjs && node tests/p4/archive-lineage-tests.mjs && node tests/p4/checkpoint-authority-tests.mjs
      - name: Frozen upstream integration
        run: node tests/integration/p2-p4-contract-tests.mjs && node tests/integration/p3-p4-contract-tests.mjs && node tests/integration/p4-p5-static-binding-tests.mjs
      - name: P5 physical and terrain
        run: node tests/p5/run-p5-conformance.mjs && node tests/integration/p3-p5-contract-tests.mjs
      - name: P5 Environment v2 exact authority
        run: node tests/p5-environment-v2/run-environment-v2-conformance.mjs && node tests/p5-environment-v2/worker-environment-v2.mjs && python3 tools/p5_environment_v2_oracle.py
      - name: P6 environment state vocabulary
        run: node tests/p6/environment-state-conformance.mjs
      - name: P6 authority, witness and identity adversarial seal
        run: node tests/p6/authority-identity-adversarial.mjs
      - name: P6 canonical v1 integration
        run: node tests/p6/run-p6-v1.mjs
      - name: P6 Golden corpus
        run: node tests/p6/golden-v1.mjs
      - name: P6 save reopen replay compatibility
        run: node tests/p6/save-compatibility.mjs
      - name: Worker-order independence
        run: node tests/p6/worker-order.mjs
      - name: Sparse working set
        run: node --expose-gc tests/p6/working-set.mjs
      - name: Independent Python oracle
        run: python3 tools/p6_oracle.py
      - name: Reproducible canonical P6 single-file build
        shell: bash
        run: |
          node tools/build-ofu-p6.mjs > /tmp/p6-build-first.json
          cp dist/One_File_Universe.html /tmp/One_File_Universe.p6.first.html
          cp dist/p6-build-manifest.json /tmp/p6-build-manifest.first.json
          node tools/build-ofu-p6.mjs > /tmp/p6-build-second.json
          cmp /tmp/One_File_Universe.p6.first.html dist/One_File_Universe.html
          cmp /tmp/p6-build-manifest.first.json dist/p6-build-manifest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        if: always()
        with:
          name: p6-v1-node-${{ env.OFU_SOURCE_SHA }}
          path: |
            dist/evidence/p6/
            dist/p6-build-manifest.json
            dist/One_File_Universe.html
  browser-linux:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, firefox, webkit]}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with: {ref: '${{ env.OFU_SOURCE_SHA }}'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tools/build-ofu-p6.mjs
      - run: node tests/p6/browser-p6-v1.mjs
        env: {BROWSER: '${{ matrix.browser }}'}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        if: always()
        with:
          name: p6-v1-linux-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/
  browser-platform:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, browser: chromium}
          - {os: macos-latest, browser: webkit}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with: {ref: '${{ env.OFU_SOURCE_SHA }}'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - run: node tools/build-ofu-p6.mjs
      - run: node tests/p6/browser-p6-v1.mjs
        env: {BROWSER: '${{ matrix.browser }}'}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        if: always()
        with:
          name: p6-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/
  seal:
    if: ${{ always() && needs.route.outputs.run == 'true' }}
    needs: [route, node, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require all exact-head jobs
        shell: bash
        run: |
          test '${{ needs.node.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 / Node 24 runtime
        with:
          pattern: p6-v1-*-${{ env.OFU_SOURCE_SHA }}
          path: evidence
          merge-multiple: true
      - name: Cross-runtime canonical seal
        shell: bash
        run: |
          count=$(find evidence -name 'browser-*.json' -type f | wc -l)
          test "$count" -eq 5
          test "$(jq -r '.status' evidence/browser-*.json | sort -u)" = PASS
          test "$(jq -r '.manifestHash' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.biosphereId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.lineageId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.speciesId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.stateDigest' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.artifactSha256' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.goldenCorpusDigest' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.sourceCommit' evidence/browser-*.json | sort -u)" = "$OFU_SOURCE_SHA"
          test "$(jq -r 'select(.hostPlatform==\"darwin\") | .hostArch' evidence/browser-*.json)" = arm64
          test "$(jq -r '.realSafariVerified' evidence/browser-*.json | sort -u)" = false
          test "$(jq -r '.artifactContainsConformanceAuthority' evidence/browser-*.json | sort -u)" = false
          test "$(jq -r '.shippedConformanceConstructor' evidence/browser-*.json | sort -u)" = false
          test "$(jq -r '.canonicalGenesisAvailable' evidence/browser-*.json | sort -u)" = false
          test "$(jq -r '.persistentLineageTransitions' evidence/browser-*.json | sort -u)" = false
          echo 'P6 v1 cross-runtime exact-head seal PASS'
