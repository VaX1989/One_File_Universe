name: P6 v1 Conformance

on:
  push:
    branches:
      - research/p6-v1-promotion-prep
      - feature/p6-biosphere-evolution-v1
  pull_request:
    branches:
      - main
    paths:
      - 'src/domains/biosphere/**'
      - 'tests/p6/**'
      - 'tools/p6_*'
      - 'docs/P6_*'
      - 'docs/adr/ADR-020-*'
      - '.github/workflows/p6-v1-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Foundation and frozen P1-P5 regression
        run: |
          node tools/validate-foundation.mjs
          node tests/run-node-tests.mjs
          node tests/p2/run-p2-tests.mjs
          node tests/p3/run-p3-conformance.mjs
          node tests/p4/run-p4-tests.mjs
          node tests/p5/run-p5-conformance.mjs
          node tests/integration/p3-p5-contract-tests.mjs
      - name: P6 canonical v1 exact-head conformance
        run: node tests/p6/run-p6-v1.mjs
      - name: Worker-order independence
        run: node tests/p6/worker-order.mjs
      - name: Sparse working set
        run: node --expose-gc tests/p6/working-set.mjs
      - name: Independent Python oracle
        run: python3 tools/p6_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-v1-node-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/

  browser-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/p6/browser-p6-v1.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-v1-linux-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/

  browser-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - run: node tests/p6/browser-p6-v1.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/

  seal:
    if: ${{ always() }}
    needs: [node, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require all exact-head jobs
        shell: bash
        run: |
          test '${{ needs.node.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p6-v1-*-${{ env.OFU_SOURCE_SHA }}
          path: evidence
          merge-multiple: true
      - name: Cross-runtime canonical seal
        shell: bash
        run: |
          count=$(find evidence -name 'browser-*.json' -type f | wc -l)
          test "$count" -eq 5
          test "$(jq -r '.status' evidence/browser-*.json | sort -u)" = PASS
          test "$(jq -r '.manifestHash' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.biosphereId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.lineageId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.speciesId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.stateDigest' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.sourceCommit' evidence/browser-*.json | sort -u)" = "$OFU_SOURCE_SHA"
          test "$(jq -r 'select(.hostPlatform=="darwin") | .hostArch' evidence/browser-*.json)" = arm64
          echo 'P6 v1 cross-runtime exact-head seal PASS'