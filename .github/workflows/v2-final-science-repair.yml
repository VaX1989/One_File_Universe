name: V2 Science Authority

on:
  push:
    branches:
      - integration/v2x-supreme-total-convergence-2026-09-07
    paths:
      - src/**
      - config/components/**
      - tests/audit/**
      - .github/workflows/v2-final-science-repair.yml

permissions:
  contents: read

concurrency:
  group: v2-final-science-repair
  cancel-in-progress: false

jobs:
  science-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Authenticate exact source head
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain=v1
      - name: Static integrity
        run: git diff --check
      - name: Strict science authority oracle
        run: node tests/audit/v2-science-authority-oracle.mjs --strict
      - name: Repository node regression suite
        run: node tests/run-node-tests.mjs
      - name: Verify source remained unchanged
        run: git diff --exit-code
