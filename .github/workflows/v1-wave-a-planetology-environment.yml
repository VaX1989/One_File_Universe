name: V1 Wave A Planetology Environment
on:
  push:
    branches:
      - parallel/v1-wave-a-planetology-environment-2026-09-05
  pull_request:
    paths:
      - 'src/domains/v1/planetology/**'
      - 'src/domains/v1/environment/**'
      - 'tests/v1/planetology/**'
      - 'tests/v1/environment/**'
      - 'config/components/planetology-environment-v1.json'
      - 'src/domains/v1/world.js'
      - 'config/components/v1.json'
jobs:
  lane-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Syntax
        run: |
          node --check src/domains/v1/planetology/causal-system.js
          node --check src/domains/v1/environment/world-system.js
      - name: Causal planetology oracle
        run: node tests/v1/planetology/causal-system.mjs
      - name: Environment oracle
        run: node tests/v1/environment/world-system.mjs
      - name: Additive component integrity
        run: node tests/extensions/components.mjs
