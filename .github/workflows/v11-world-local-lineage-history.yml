name: V1.1 World Local Lineage History
on:
  push:
    branches:
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/evolution/local-lineage-context.js'
      - 'tests/v1/evolution/local-lineage-context.mjs'
      - 'config/components/v11-local-lineage-history.json'
      - '.github/workflows/v11-world-local-lineage-history.yml'

permissions:
  contents: read

concurrency:
  group: v11-world-local-lineage-history-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  local-lineage-history:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/evolution/local-lineage-context.js
          node --check tests/v1/evolution/local-lineage-context.mjs
      - name: Existing ecology causal oracle
        run: node tests/v1/ecology/causal-niche.mjs
      - name: Local lineage history oracle
        run: node tests/v1/evolution/local-lineage-context.mjs
      - name: Live component graph integrity
        run: node tests/extensions/components.mjs
