name: P6 Wave 2 Research

on:
  push:
    branches:
      - research/p6-contract-alignment-v2
  pull_request:
    branches:
      - main
    paths:
      - 'research/p6/**'
      - 'tests/p6-research/**'
      - 'docs/p6-research/**'
      - '.github/workflows/p6-wave2-research.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  node-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Frozen canonical P5 regression
        run: node tests/p5/run-p5-conformance.mjs && node tests/integration/p3-p5-contract-tests.mjs
      - name: P6 Wave 2 real P5 integration and research semantics
        run: node tests/p6-research/run-p6-wave2.mjs
      - name: Worker and scheduling independence
        run: node tests/p6-research/worker-order-v2.mjs
      - name: Bounded working-set research observation
        shell: bash
        run: |
          mkdir -p dist/evidence/p6
          node --expose-gc tests/p6-research/working-set-v2.mjs | tee dist/evidence/p6/node-working-set.json
      - uses: actions/upload-artifact@v4
        with:
          name: p6-wave2-node-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/

  browser-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/p6-research/browser-p6-v2.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-wave2-linux-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/

  browser-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - run: node tests/p6-research/browser-p6-v2.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-wave2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p6/

  research-seal:
    if: ${{ always() }}
    needs: [node-research, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require Wave 2 research evidence
        shell: bash
        run: |
          test '${{ needs.node-research.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p6-wave2-*-${{ env.OFU_SOURCE_SHA }}
          path: evidence
          merge-multiple: true
      - name: Compare browser research semantics
        shell: bash
        run: |
          count=$(find evidence -name 'browser-*.json' -type f | wc -l)
          test "$count" -eq 5
          test "$(jq -r '.status' evidence/browser-*.json | sort -u)" = PASS
          test "$(jq -r '.canonicalState' evidence/browser-*.json | sort -u)" = INSUFFICIENT_ENVIRONMENT
          test "$(jq -r '.minimumCanGenerate' evidence/browser-*.json | sort -u)" = false
          test "$(jq -r '.planetId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.manifestHash' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.biosphereId' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.primaryProductivityU' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r 'select(.hostPlatform=="darwin") | .hostArch' evidence/browser-*.json)" = arm64
          echo 'P6 Wave 2 cross-runtime research evidence PASS (non-canonical)'
