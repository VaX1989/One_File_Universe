name: V1.1 World Galactic Neighborhood
on:
  pull_request:
    paths:
      - 'src/domains/v1/astronomy/neighborhood.js'
      - 'tests/v1/astronomy/neighborhood.mjs'
      - 'config/components/v11-astronomy-neighborhood.json'
      - '.github/workflows/v11-world-astronomy-neighborhood.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-world-astronomy-neighborhood-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  galactic-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/astronomy/neighborhood.js
          node --check tests/v1/astronomy/neighborhood.mjs
      - name: Existing astronomy depth oracle
        run: node tests/v1/astronomy/depth.mjs
      - name: Astronomy observability oracle
        run: node tests/v1/astronomy/observability.mjs
      - name: Galactic neighborhood oracle
        run: node tests/v1/astronomy/neighborhood.mjs
      - name: Component descriptor integration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {planComponents} from './tools/extensions/components.mjs';
          const actual=JSON.parse(fs.readFileSync('config/components/v11-astronomy-neighborhood.json','utf8')).components[0];
          const base={id:'v1.models.astronomy',version:'1.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source:'src/domains/v1/astronomy.js',dependencies:[],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:['v1.models.astronomy']};
          const depth=JSON.parse(fs.readFileSync('config/components/v11-astronomy-depth.json','utf8')).components[0];
          const observability=JSON.parse(fs.readFileSync('config/components/v11-astronomy-observability.json','utf8')).components[0];
          const plan=planComponents([base,depth,observability,actual]);
          if(!plan.some(x=>x.id==='v1.models.astronomy.galactic-neighborhood'))throw new Error('galactic neighborhood component missing');
          console.log(JSON.stringify({status:'PASS',component:'v1.models.astronomy.galactic-neighborhood',planned:plan.length}));
          NODE
      - name: Workflow reproducibility guard
        run: node tests/governance/workflow-reproducibility.mjs
