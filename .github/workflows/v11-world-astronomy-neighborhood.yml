name: V1.1 World Galactic Neighborhood
on:
  push:
    branches:
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/astronomy/neighborhood.js'
      - 'tests/v1/astronomy/neighborhood.mjs'
      - 'config/components/v11-astronomy-neighborhood.json'
      - '.github/workflows/v11-world-astronomy-neighborhood.yml'

permissions:
  contents: read

concurrency:
  group: v11-world-astronomy-neighborhood-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  galactic-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/astronomy/neighborhood.js
          node --check tests/v1/astronomy/neighborhood.mjs
      - name: Existing astronomy depth oracle
        run: node tests/v1/astronomy/depth.mjs
      - name: Astronomy observability oracle
        run: node tests/v1/astronomy/observability.mjs
      - name: Galactic neighborhood oracle
        run: node tests/v1/astronomy/neighborhood.mjs
      - name: Live component graph integrity
        run: node tests/extensions/components.mjs
      - name: Workflow reproducibility guard
        run: node tests/governance/workflow-reproducibility.mjs
