name: Exact Source Reproduction Bundle

# Diagnostic source transport, not a certification or release gate.
# Only tracked public repository objects are archived; no runner files,
# credentials, caches, or environment values are included.
# Every canonical head and every proposed post-v1 head must be reproducible without network access.
on:
  push:
    branches:
      - main
      - 'development/v1.*'
      - integration/wave-iv-massive-convergence-vertical-slice-2026-09-04
      - docs/founder-vision-multiscale-formalization-2026-09-05
      - integration/wave-v-parallel-base-enablement-2026-09-05
      - integration/v1.0-definitive-product-convergence-2026-09-05
  pull_request:
    branches:
      - 'development/v1.*'

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

concurrency:
  group: source-reproduction-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact tracked source and ancestry
        env:
          EXPECTED_SHA: ${{ env.OFU_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p dist/source-reproduction
          git archive --format=tar.gz --output=dist/source-reproduction/exact-source.tar.gz HEAD
          git bundle create dist/source-reproduction/source.bundle --all HEAD
          git bundle verify dist/source-reproduction/source.bundle
          git for-each-ref --format='%(refname) %(objectname)' > dist/source-reproduction/refs.txt
          printf 'SOURCE_SHA=%s\nSOURCE_TREE=%s\nPURPOSE=DIAGNOSTIC_NOT_CERTIFICATION\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > dist/source-reproduction/source.txt
          (cd dist/source-reproduction && sha256sum exact-source.tar.gz source.bundle refs.txt source.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-reproduction-${{ env.OFU_SOURCE_SHA }}
          path: dist/source-reproduction/
          if-no-files-found: error
          retention-days: 30
