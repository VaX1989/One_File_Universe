name: V1.1 World Atmospheric Column
on:
  push:
    branches:
      - development/v1.1-quality-exploration
    paths:
      - 'src/domains/v1/environment/atmospheric-column.js'
      - 'tests/v1/environment/atmospheric-column.mjs'
      - 'config/components/v11-atmospheric-column.json'
      - 'config/components/v1.json'
      - '.github/workflows/v11-world-atmospheric-column.yml'
  pull_request:
    paths:
      - 'src/domains/v1/environment/atmospheric-column.js'
      - 'tests/v1/environment/atmospheric-column.mjs'
      - 'config/components/v11-atmospheric-column.json'
      - 'config/components/v1.json'
      - '.github/workflows/v11-world-atmospheric-column.yml'
      - 'src/domains/v1/planetology/causal-system.js'
      - 'src/domains/v1/environment/world-system.js'
      - 'src/domains/v1/planetology/giant-family.js'
permissions:
  contents: read
concurrency:
  group: v11-world-atmospheric-column-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  atmospheric-column:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/environment/atmospheric-column.js
          node --check tests/v1/environment/atmospheric-column.mjs
      - name: Causal planetology regression
        run: node tests/v1/planetology/causal-system.mjs
      - name: Environment regression
        run: node tests/v1/environment/world-system.mjs
      - name: Giant-family composition regression
        run: node tests/v1/planetology/giant-family.mjs
      - name: Atmospheric column oracle
        run: node tests/v1/environment/atmospheric-column.mjs
      - name: Component and modeled-world load-order integration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {planComponents} from './tools/extensions/components.mjs';
          const common={id:'v1.models.common',version:'1.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source:'src/domains/v1/common.js',dependencies:[],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:['v1.models.common']};
          const causal={id:'v1.models.planetology.causal-system',version:'2.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source:'src/domains/v1/planetology/causal-system.js',dependencies:['v1.models.common'],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:['v1.models.planetology.causal-system']};
          const environment={id:'v1.models.environment.world-system',version:'2.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source:'src/domains/v1/environment/world-system.js',dependencies:['v1.models.planetology.causal-system'],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:['v1.models.environment.world-system']};
          const giant=JSON.parse(fs.readFileSync('config/components/v11-giant-family.json','utf8')).components[0];
          const atmosphere=JSON.parse(fs.readFileSync('config/components/v11-atmospheric-column.json','utf8')).components[0];
          const core=JSON.parse(fs.readFileSync('config/components/v1.json','utf8')).components;
          const world=core.find(x=>x.id==='v1.models.world');
          if(!world)throw new Error('v1 modeled-world descriptor missing');
          if(!world.dependencies.includes('v1.environment.atmospheric-column'))throw new Error('modeled-world does not declare atmospheric-column load dependency');
          const plan=planComponents([common,causal,environment,giant,atmosphere]);
          const ids=plan.map(x=>x.id),e=ids.indexOf('v1.models.environment.world-system'),g=ids.indexOf('v1.planetology.giant-family'),a=ids.indexOf('v1.environment.atmospheric-column');
          if(e<0||g<=e||a<=g)throw new Error('atmospheric column component ordering invalid');
          console.log(JSON.stringify({status:'PASS',component:'v1.environment.atmospheric-column',planned:ids,worldDependsOnAtmosphericColumn:true}));
          NODE
      - name: Full additive component integrity
        run: node tests/extensions/components.mjs
      - name: Workflow reproducibility guard
        run: node tests/governance/workflow-reproducibility.mjs
