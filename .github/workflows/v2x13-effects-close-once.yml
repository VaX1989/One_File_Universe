name: V2X13 Effects Closure Once

on:
  push:
    branches:
      - integration/v2x-supreme-total-convergence-2026-09-07
    paths:
      - .github/workflows/v2x13-effects-close-once.yml

permissions:
  contents: write

jobs:
  close-effects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/v2x-supreme-total-convergence-2026-09-07
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
      - name: Apply and verify V2X-13 effects closure
        shell: bash
        run: |
          set -euo pipefail
          python tools/v2x13-effects-close-once.py
          node --check src/rendering/webgl2/resources.js
          node tests/render-platform/run-render-platform-convergence-tests.mjs
          node tests/render-platform/run-render-platform-tests.mjs
          node tests/render-platform/run-render-platform-depth-tests.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rendering/webgl2/resources.js config/components/v2x-13-rendering-platform.json tests/render-platform/run-render-platform-convergence-tests.mjs
          git commit -m 'V2X-13 close shadow and volumetric pixel passes'
          git push origin HEAD:integration/v2x-supreme-total-convergence-2026-09-07
