name: V1.1 World Local Interaction Network
on:
  pull_request:
    paths:
      - 'src/domains/v1/ecology/local-trophic-context.js'
      - 'tests/v1/ecology/local-trophic-context.mjs'
      - 'tests/v1/ecology/local-context-composition.mjs'
      - 'config/components/v11-local-interaction-network.json'
      - '.github/workflows/v11-world-local-interaction-network.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-world-local-interaction-network-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  local-interaction-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/ecology/local-trophic-context.js
          node --check tests/v1/ecology/local-trophic-context.mjs
          node --check tests/v1/ecology/local-context-composition.mjs
      - name: Upstream local biogeography regression
        run: node tests/v1/ecology/biogeography-context.mjs
      - name: Local interaction network oracle
        run: node tests/v1/ecology/local-trophic-context.mjs
      - name: Local ecology wrapper composition
        run: node tests/v1/ecology/local-context-composition.mjs
      - name: Component descriptor integration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {planComponents} from './tools/extensions/components.mjs';
          const actual=JSON.parse(fs.readFileSync('config/components/v11-local-interaction-network.json','utf8')).components[0];
          const deps=[
            {id:'v1.ecology.query',version:'1.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source:'src/domains/v1/ecology/query.js',dependencies:[],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:['v1.ecology.query']},
            {id:'v1.ecology.local-biogeography',version:'1.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source:'src/domains/v1/ecology/biogeography-context.js',dependencies:[],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:['v1.ecology.local-biogeography']}
          ];
          const plan=planComponents([...deps,actual]);
          if(!plan.some(x=>x.id==='v1.ecology.local-interaction-network'))throw new Error('local interaction network component missing');
          console.log(JSON.stringify({status:'PASS',component:'v1.ecology.local-interaction-network',planned:plan.length}));
          NODE
      - name: Workflow reproducibility guard
        run: node tests/governance/workflow-reproducibility.mjs
