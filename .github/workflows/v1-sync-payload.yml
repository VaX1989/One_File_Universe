name: v1 convergence payload sync
on:
  push:
    branches:
      - integration/v1.0-definitive-product-convergence-2026-09-05
permissions:
  contents: write
concurrency:
  group: v1-convergence-payload-sync
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Reconstruct exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v1-payload/0* | base64 -d | gzip -d > /tmp/v1.patch
          echo '7303e480406a75b727f19191acad30e901e3635ae24a244c0ee7d66e0ee84f09  /tmp/v1.patch' | sha256sum -c -
          git apply --binary --index /tmp/v1.patch
          rm -rf .github/v1-payload
          rm .github/workflows/v1-sync-payload.yml
          git add -A
          test "$(git write-tree)" = 'b8eba8af3b93d8304fc8f40dc28c1db43a496a25'
      - name: Verify v1 convergence before commit
        shell: bash
        run: |
          set -euo pipefail
          node tests/v1/world-discovery.mjs
          node tests/v1/provider-integration.mjs
          node tests/v1/release-model-seal.mjs
          node tests/v1/model-regime-runtime.mjs
          node tests/wave-iv/convergence-runtime.mjs
          node tests/wave-iv/macro/macro-oracles.mjs
          node tools/extensions/conformance.mjs INTEGRATION
          node tools/build-ofu-rendering-v09.mjs
          cp dist/One_File_Universe.html /tmp/v1-first.html
          cp dist/rendering-build-manifest.json /tmp/v1-first-manifest.json
          node tools/build-ofu-rendering-v09.mjs
          cmp /tmp/v1-first.html dist/One_File_Universe.html
          cmp /tmp/v1-first-manifest.json dist/rendering-build-manifest.json
      - name: Commit exact verified convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v1: integrate galactic region, micro regimes and bounded world discovery'
          test "$(git rev-parse HEAD^{tree})" = 'b8eba8af3b93d8304fc8f40dc28c1db43a496a25'
          node tools/extensions/conformance.mjs INTEGRATION --exact
      - name: Anti-race fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
