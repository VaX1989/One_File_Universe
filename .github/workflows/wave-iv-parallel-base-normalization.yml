name: Wave IV Parallel Base Normalization

on:
  workflow_dispatch:
  push:
    branches: [integration/wave-iv-parallel-base-normalization-2026-09-04]

concurrency:
  group: wave-iv-parallel-base-normalization-${{ github.ref }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  normalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Focused normalization and regression contracts
        run: |
          node --check src/bootstrap/product/scale-runtime.js
          node --check src/bootstrap/product/input-router.js
          node --check src/bootstrap/product/scene-normalizer.js
          node --check src/bootstrap/product/explorer-scene-adapter.js
          node tests/product/wave-iv-normalization.mjs
          node tests/product/v08-parallel-seams.mjs
          node tests/product/v08-inspector-product.mjs
          node tests/product/v08-lab-technical.mjs
          node tests/product/v08-mobile-interaction.mjs
          node tests/product/v09-explorer-beta.mjs
          node tests/rendering/v09-visual-universe.mjs
      - name: Build exact normalized single file
        run: |
          node tools/build-ofu-rendering-v09.mjs > /tmp/wave-iv-build.json
          grep -q '"sourceCommit": "'"$OFU_SOURCE_SHA"'"' dist/rendering-build-manifest.json
          grep -q '"version": "ofu-wave-iv-scale-runtime-1"' dist/rendering-build-manifest.json
          grep -q '"sceneProviderContract": "ofu-wave-iv-scene-provider-1"' dist/rendering-build-manifest.json
          grep -q '"semanticScaleAlwaysDefined": true' dist/rendering-build-manifest.json
          test "$(grep -Eoc '(src|href)=[\"'\'']https?://' dist/One_File_Universe.html)" -eq 0
          grep -q "connect-src 'none'" dist/One_File_Universe.html
      - name: Focused Chromium interaction evidence
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/product/browser-v09-explorer-beta.mjs
          node tests/product/browser-v09-visual-bridge.mjs
          node tests/product/browser-wave-iv-normalization.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wave-iv-parallel-base-normalization-${{ env.OFU_SOURCE_SHA }}
          path: |
            dist/One_File_Universe.html
            dist/rendering-build-manifest.json
            dist/evidence/product-v09/
            dist/evidence/wave-iv-normalization/
