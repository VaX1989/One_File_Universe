name: V2X Supreme Convergence

on:
  pull_request:
    branches:
      - development/v1.1-quality-exploration
  workflow_dispatch:

permissions:
  contents: read

env:
  OFU_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_EXPECTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Exact source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OFU_EXPECTED_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Full repository test and reproducible build stack
        run: npm test
      - name: V2X-10 convergence blocker regressions
        run: node tests/v2x10/convergence-blockers.mjs
      - name: Living macrocosm composition witness
        run: node tests/v2x-convergence/macrocosm-composition.mjs
      - name: Progressive release conformance exact source
        env:
          OFU_SOURCE_SHA: ${{ env.OFU_EXPECTED_SHA }}
        run: node tools/extensions/conformance.mjs RELEASE --exact
