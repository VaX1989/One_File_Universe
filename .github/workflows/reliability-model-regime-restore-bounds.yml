name: Reliability Model Regime Restore Bounds

on:
  push:
    branches:
      - 'development/v1.*'
    paths:
      - 'src/domains/v1/session.js'
      - 'src/domains/v1/regime-runtime.js'
      - 'tests/v1/model-regime-restore-bounds.mjs'
      - '.github/workflows/reliability-model-regime-restore-bounds.yml'
  pull_request:
    branches:
      - 'development/v1.*'
    paths:
      - 'src/domains/v1/session.js'
      - 'src/domains/v1/regime-runtime.js'
      - 'tests/v1/model-regime-restore-bounds.mjs'
      - '.github/workflows/reliability-model-regime-restore-bounds.yml'

concurrency:
  group: reliability-model-regime-restore-bounds-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: '${{ env.OFU_SOURCE_SHA }}'
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Workflow reproducibility guard
        run: node tests/governance/workflow-reproducibility.mjs
      - name: Bounded model-regime restore regression
        run: node tests/v1/model-regime-restore-bounds.mjs
      - name: Full session persistence regression
        run: node tests/v1/session-persistence.mjs
