name: Wave IV Massive Convergence Development
on:
  push:
    branches: [integration/wave-iv-massive-convergence-vertical-slice-2026-09-04]
  pull_request:
    branches:
      - main
      - integration/wave-iv-parallel-base-normalization-2026-09-04
  workflow_dispatch:
concurrency:
  group: wave-iv-massive-convergence-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Hardened camera and presentation regressions
        run: |
          node tests/rendering/v08-camera-framing.mjs
          node tests/rendering/v08-fv04-diagnostic.mjs
          node tests/rendering/v08-visual-oracles.mjs
      - name: Macro and convergence semantic oracles
        run: |
          node tests/wave-iv/macro/macro-oracles.mjs
          node tests/wave-iv/convergence-runtime.mjs
      - name: Surface authority, frustum coverage, unsupported-body, continuity, and relief oracles
        run: |
          node tests/rendering/vertex-array-ownership.mjs
          node tests/rendering/wave-iv-surface-frame.mjs
          node tests/rendering/wave-iv-surface-terrain.mjs
          node tests/wave-iv/surface-capability.mjs
          node tests/wave-iv/terrain-continuity.mjs
          node tests/wave-iv/surface-frustum-coverage.mjs
          node tests/wave-iv/surface-relief-presentation.mjs
      - name: Reproducible exact-head Wave IV single file
        shell: bash
        run: |
          node tools/build-ofu-rendering-v09.mjs > /tmp/wave-iv-build-1.json
          cp dist/One_File_Universe.html /tmp/wave-iv-first.html
          cp dist/rendering-build-manifest.json /tmp/wave-iv-first-manifest.json
          node tools/build-ofu-rendering-v09.mjs > /tmp/wave-iv-build-2.json
          cmp /tmp/wave-iv-first.html dist/One_File_Universe.html
          cmp /tmp/wave-iv-first-manifest.json dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-scale-runtime-3' dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-input-router-6' dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-input-intent-3' dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-macro-canvas-4' dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-macro-interaction-3' dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-macro-travel-2' dist/rendering-build-manifest.json
          grep -q 'applicationOwnsCanvasTouchGestures' dist/rendering-build-manifest.json
          grep -q 'allCanonicalPlanetsVisible' dist/rendering-build-manifest.json
          grep -q 'directPlanetVisit' dist/rendering-build-manifest.json
          grep -q 'ofu-planet-webgl2-presentation-5' dist/rendering-build-manifest.json
          grep -q 'DETERMINISTIC_PLANET_WIDE_MATERIAL_REGIONS_V4' dist/rendering-build-manifest.json
          grep -q 'largeScalePresentationRegions' dist/rendering-build-manifest.json
          grep -q 'canonicalRegionClaim' dist/rendering-build-manifest.json
          grep -q 'ofu-wave-iv-surface-scale-sync-7' dist/rendering-build-manifest.json
          grep -q 'SPHERICAL_PLANET_WEBGL_HANDOFF' dist/rendering-build-manifest.json
          grep -q 'globalSurfaceGlobeDistanceRadii' dist/rendering-build-manifest.json
          grep -q 'globalGlobeHandoffAtomic' dist/rendering-build-manifest.json
          grep -q 'ofu-local-terrain-lod-4' dist/rendering-build-manifest.json
          grep -q 'ofu-surface-relief-presentation-1' dist/rendering-build-manifest.json
          grep -q 'ofu-local-surface-webgl2-8' dist/rendering-build-manifest.json
          grep -q 'DETERMINISTIC_LOCAL_MATERIAL_REGIONS_V1' dist/rendering-build-manifest.json
          grep -q 'presentationElevationColorRangeM' dist/rendering-build-manifest.json
          grep -q 'FRUSTUM_GROUND_FOOTPRINT_BOUNDED' dist/rendering-build-manifest.json
          grep -q 'CAMERA_LOCATION_PRESENTATION_RELIEF_DATUM' dist/rendering-build-manifest.json
          grep -q 'PLANET_WIDE_TO_HUMAN_SCALE_PRESENTATION_V3' dist/rendering-build-manifest.json
          grep -q 'INSTANCED_LOW_POLY_TRIANGLES' dist/rendering-build-manifest.json
          grep -q 'dd3348834d15ddf6a409912ac3e263c1e6d81fc4' dist/rendering-build-manifest.json
          grep -q '34874da12a157deba6d7615ff07a20a83606d938' dist/rendering-build-manifest.json
          grep -q '56e44c8708338309f90a6354ce16f4140ea87ca0' dist/rendering-build-manifest.json
          test "$(grep -Eoc '(src|href)=["'\'']https?://' dist/One_File_Universe.html)" -eq 0
          grep -q "connect-src 'none'" dist/One_File_Universe.html
      - name: Install Chromium evidence runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Founder interaction, touch, direct-world, responsive and globe-detail oracle
        run: node tests/wave-iv/browser-founder-interaction.mjs
      - name: Desktop and 390x844 full visual traversal
        run: node tests/wave-iv/browser-convergence.mjs
      - name: 360x800 and 320x700 compact mobile pass
        run: node tests/wave-iv/browser-mobile-compact.mjs
      - name: Ten-cycle resource soak
        run: node tests/wave-iv/browser-soak.mjs
      - name: Freeze founder-test filename and checksums
        shell: bash
        run: |
          short="${OFU_SOURCE_SHA:0:12}"
          name="One_File_Universe-WAVE-IV-FOUNDER-TEST-${short}.html"
          cp dist/One_File_Universe.html "dist/${name}"
          bytes=$(wc -c < "dist/${name}" | tr -d ' ')
          sha=$(sha256sum "dist/${name}" | awk '{print $1}')
          printf 'source_sha=%s\nartifact=%s\nbytes=%s\nsha256=%s\n' "$OFU_SOURCE_SHA" "$name" "$bytes" "$sha" | tee dist/FOUNDER_TEST_ARTIFACT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave-iv-founder-test-${{ env.OFU_SOURCE_SHA }}
          path: |
            dist/One_File_Universe-WAVE-IV-FOUNDER-TEST-*.html
            dist/rendering-build-manifest.json
            dist/FOUNDER_TEST_ARTIFACT.txt
            dist/evidence/wave-iv-convergence/
  browser-linux:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-rendering-v09.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Galaxy to Human cross-browser traversal
        shell: bash
        run: |
          if [ "$BROWSER" = "chromium" ]; then
            node tests/wave-iv/browser-convergence-matrix.mjs
          else
            xvfb-run -a node tests/wave-iv/browser-convergence-matrix.mjs
          fi
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: ${{ matrix.browser == 'chromium' && '2' || '1' }}
          HEADED: ${{ matrix.browser == 'chromium' && '0' || '1' }}
  browser-platform:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-rendering-v09.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - name: Galaxy to Human platform traversal
        run: node tests/wave-iv/browser-convergence-matrix.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          DPR: '1'
  seal:
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: [exact-head, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Wave IV gates
        shell: bash
        run: |
          test '${{ needs.exact-head.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
