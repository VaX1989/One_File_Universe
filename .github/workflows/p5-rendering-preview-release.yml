name: P1-P6 Rendering Preview Release

on:
  workflow_run:
    workflows: ["Rendering Production"]
    types: [completed]

# v0.5.0-preview.1 is already published and independently certified. This
# workflow is deliberately verify-only from this point forward: it cannot
# recreate, replace, retarget or upload to the sealed release. A future release
# line must use a separately certified draft-first staging transaction.
concurrency:
  group: p1-p6-rendering-preview-v0.5.0-preview.1
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-sealed-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_TAG: v0.5.0-preview.1
      RELEASE_SOURCE_SHA: b39c3c1db0f32c1f84bc7959cb0fe0d276abcdf2
      RELEASE_ASSET_BYTES: '246324'
      RELEASE_ASSET_SHA256: 1fe7f9bbc94f34f7fee189e29e4201359bd3ed3c02d45ad1dc75c39ae90e2e81
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Require exact certified live main
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          LIVE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$LIVE_MAIN" = "$SOURCE_SHA"
      - name: Require sealed release and exact metadata
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isPrerelease,isDraft > /tmp/release.json
          test "$(jq -r .tagName /tmp/release.json)" = "$RELEASE_TAG"
          test "$(jq -r .targetCommitish /tmp/release.json)" = "$RELEASE_SOURCE_SHA"
          test "$(jq -r .isPrerelease /tmp/release.json)" = true
          test "$(jq -r .isDraft /tmp/release.json)" = false
          test "$(git ls-remote origin refs/tags/$RELEASE_TAG | cut -f1)" = "$RELEASE_SOURCE_SHA"
      - name: Download and verify sealed release asset
        shell: bash
        run: |
          mkdir -p /tmp/sealed-release
          gh release download "$RELEASE_TAG" -p One_File_Universe.html -D /tmp/sealed-release
          DOWNLOADED_SHA="$(sha256sum /tmp/sealed-release/One_File_Universe.html | cut -d' ' -f1)"
          DOWNLOADED_BYTES="$(stat -c%s /tmp/sealed-release/One_File_Universe.html)"
          test "$DOWNLOADED_SHA" = "$RELEASE_ASSET_SHA256"
          test "$DOWNLOADED_BYTES" = "$RELEASE_ASSET_BYTES"
          printf 'SEALED release=%s asset=%s bytes=%s sha256=%s target=%s source_run=%s\n' \
            "$RELEASE_TAG" One_File_Universe.html "$DOWNLOADED_BYTES" "$DOWNLOADED_SHA" \
            "$RELEASE_SOURCE_SHA" "$SOURCE_RUN_ID"
