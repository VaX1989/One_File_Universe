name: Product v1.1 Living Choice Semantics

on:
  pull_request:
    paths:
      - 'src/bootstrap/product/living-choice-semantics.js'
      - 'config/components/v11-product-living-choice-semantics.json'
      - 'tests/product/v11-living-choice-semantics.mjs'
      - 'tests/product/browser-v11-living-choice-semantics.mjs'
      - '.github/workflows/product-v11-living-choice-semantics.yml'
  push:
    branches:
      - 'development/v1.*'
    paths:
      - 'src/bootstrap/product/living-choice-semantics.js'
      - 'config/components/v11-product-living-choice-semantics.json'
      - 'tests/product/v11-living-choice-semantics.mjs'
      - 'tests/product/browser-v11-living-choice-semantics.mjs'
      - '.github/workflows/product-v11-living-choice-semantics.yml'
  workflow_dispatch:

concurrency:
  group: product-v11-living-choice-semantics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  exact-head-product:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24 runtime
        with:
          ref: '${{ env.OFU_SOURCE_SHA }}'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Living choice semantic contracts
        run: node tests/product/v11-living-choice-semantics.mjs
      - name: Build shipping single-file product
        run: |
          node tools/build-ofu-rendering-v09.mjs
          test "$(grep -Eoc "(src|href)=[\"']https?://" dist/One_File_Universe.html)" -eq 0
          grep -q "connect-src 'none'" dist/One_File_Universe.html
      - name: Install pinned Chromium oracle
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Visible Living choice semantic evidence
        run: node tests/product/browser-v11-living-choice-semantics.mjs
