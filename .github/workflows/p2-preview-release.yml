name: P2 Preview Release

on:
  workflow_run:
    workflows: ["P2 Conformance"]
    types: [completed]
  workflow_dispatch:

# Historical release. Verify only; never delete, recreate, retarget or upload.
permissions:
  contents: read
  actions: read

jobs:
  verify-historical-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.2.0-preview.1
      RELEASE_SOURCE_SHA: 0d802f2af87e7db4ba9553f11cc9914c93a3cebc
      RELEASE_ASSET_BYTES: '100818'
      RELEASE_ASSET_SHA256: 91f34fd081e172ae992a160af197d4ea69dbe8dc167be0ac0ae7f81834960a98
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - name: Verify historical release metadata and tag
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isPrerelease,isDraft > /tmp/release.json
          test "$(jq -r .tagName /tmp/release.json)" = "$RELEASE_TAG"
          test "$(jq -r .targetCommitish /tmp/release.json)" = "$RELEASE_SOURCE_SHA"
          test "$(jq -r .isPrerelease /tmp/release.json)" = true
          test "$(jq -r .isDraft /tmp/release.json)" = false
          test "$(git ls-remote origin refs/tags/$RELEASE_TAG | cut -f1)" = "$RELEASE_SOURCE_SHA"
      - name: Verify historical asset bytes
        shell: bash
        run: |
          mkdir -p /tmp/release
          gh release download "$RELEASE_TAG" -p One_File_Universe.html -D /tmp/release
          test "$(sha256sum /tmp/release/One_File_Universe.html | cut -d' ' -f1)" = "$RELEASE_ASSET_SHA256"
          test "$(stat -c%s /tmp/release/One_File_Universe.html)" = "$RELEASE_ASSET_BYTES"
