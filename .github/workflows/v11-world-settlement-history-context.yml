name: V1.1 World Settlement Historical Context
on:
  push:
    branches:
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/civilization/settlement-history-context.js'
      - 'tests/v1/civilization/settlement-history-context.mjs'
      - 'config/components/v11-settlement-history-context.json'
      - '.github/workflows/v11-world-settlement-history-context.yml'
jobs:
  settlement-history-context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Syntax
        run: |
          node --check src/domains/v1/civilization/settlement-history-context.js
          node --check tests/v1/civilization/settlement-history-context.mjs
      - name: Existing history and representative oracles
        run: |
          node tests/v1/history/deep-history.mjs
          node tests/v1/civilization/individuals.mjs
      - name: Settlement historical context oracle
        run: node tests/v1/civilization/settlement-history-context.mjs
      - name: Live component graph integrity
        run: node tests/extensions/components.mjs
