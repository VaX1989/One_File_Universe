name: V1 Wave A Civilization History
on:
  push:
    branches:
      - parallel/v1-wave-a-civilization-history-2026-09-05
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-wave-a-civilization-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted-civilization-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Civilization and deep-history adversarial suite
        run: |
          node tests/v1/civilization/systemic-civilization.mjs
          node tests/v1/history/deep-history.mjs
      - name: Frozen v1 civilization regression
        run: node tests/v1/domain-models.mjs
