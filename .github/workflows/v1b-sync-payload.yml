name: v1 persistence agency audio payload sync
on:
  push:
    branches:
      - integration/v1.0-definitive-product-convergence-2026-09-05
permissions:
  contents: write
concurrency:
  group: v1b-convergence-payload-sync
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - name: Reconstruct exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v1b-payload/0* | base64 -d | gzip -d > /tmp/v1b.patch
          echo 'dca28051f94f7f1eaac4e0252c9ec524f6e0ad30d63db316976625e64d3b8550  /tmp/v1b.patch' | sha256sum -c -
          git apply --binary --index /tmp/v1b.patch
          git rm -f .github/workflows/v1-certification.yml
          git rm --cached -r .github/v1b-payload .github/workflows/v1b-sync-payload.yml
          test "$(git write-tree)" = 'a624f3bde5ba35ee1505b92a87d84817033faacf'
          git add .github/v1b-payload .github/workflows/v1b-sync-payload.yml
      - name: Verify v1 persistence agency audio convergence
        shell: bash
        run: |
          set -euo pipefail
          node tests/v1/session-persistence.mjs
          node tests/v1/audio-context.mjs
          node tests/v1/world-discovery.mjs
          node tests/v1/model-regime-runtime.mjs
          node tests/v1/provider-integration.mjs
          node tests/v1/release-model-seal.mjs
          node tests/wave-iv/convergence-runtime.mjs
          node tests/wave-iv/macro/macro-oracles.mjs
          node tools/extensions/conformance.mjs INTEGRATION
          node tools/build-ofu-rendering-v09.mjs
          cp dist/One_File_Universe.html /tmp/v1b-first.html
          cp dist/rendering-build-manifest.json /tmp/v1b-first-manifest.json
          node tools/build-ofu-rendering-v09.mjs
          cmp /tmp/v1b-first.html dist/One_File_Universe.html
          cmp /tmp/v1b-first-manifest.json dist/rendering-build-manifest.json
      - name: Commit exact verified non-workflow convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v1: add portable P4 sessions, governed agency and systemic audio'
          node tools/extensions/conformance.mjs INTEGRATION --exact
      - name: Anti-race fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse origin/$GITHUB_REF_NAME)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
