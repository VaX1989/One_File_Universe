name: Foundation Integrity

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Setup Python oracle runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Validate Constitution and ADR foundation
        run: npm test
