name: Foundation Integrity

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

concurrency:
  group: foundation-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Setup Python oracle runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 / Node 24 runtime
        with:
          python-version: '3.13.15'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Validate Constitution and ADR foundation
        run: npm test
