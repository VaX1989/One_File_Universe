name: P2 Conformance

on:
  push:
    branches:
      - main
      - feature/p2-deterministic-kernel
      - 'development/v1.*'
  pull_request:

concurrency:
  group: p2-conformance-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.phase-gate.outputs.run }}
      adapter_status: ${{ steps.phase-gate.outputs.adapter_status }}
      fail_closed: ${{ steps.phase-gate.outputs.fail_closed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Route historical P2 evidence
        id: phase-gate
        shell: bash
        env:
          OFU_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          OFU_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci/phase-gate.mjs --phases P2 --base-ref "$OFU_BASE_REF" --base-sha "$OFU_BASE_SHA" --head-sha "$OFU_SOURCE_SHA"

  oracle-and-build:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    env:
      OFU_UNICODE_DATA_PATH: .unicode/UnicodeData.txt
      OFU_NORMALIZATION_TEST_PATH: .unicode/NormalizationTest.txt
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # Node 24 runtime
        with:
          python-version: '3.13.15'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Fetch official Unicode 15.1 conformance data
        run: node tools/fetch-p2-unicode-test-data.mjs full
      - name: Verify frozen Unicode profile and Node normalization
        run: node tools/p2-unicode-conformance.mjs "$OFU_UNICODE_DATA_PATH" "$OFU_NORMALIZATION_TEST_PATH"
      - name: Verify independent Python normalization
        run: python3 tools/p2_unicode_conformance.py "$OFU_UNICODE_DATA_PATH" "$OFU_NORMALIZATION_TEST_PATH"
      - run: python3 --version
      - run: node --version
      - name: Run explicit frozen Foundation/P1/P2 scope
        run: |
          node tools/validate-foundation.mjs
          node tests/run-node-tests.mjs
          node tests/p1/portable-save-size.mjs
          npm run test:p2
          node tools/build-p1.mjs
          node tests/build/reproducible-build.mjs
      - run: node tests/p2/live-wrapper-tests.mjs
      - run: node tools/p2-benchmark.mjs
      - run: node tests/integration/evidence-isolation-generic.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        with:
          name: p2-build
          path: |
            dist/One_File_Universe.html
            dist/build-manifest.json
            dist/evidence/p2-*.json

  browser:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Fetch official Unicode 15.1 normalization data
        run: node tools/fetch-p2-unicode-test-data.mjs normalization
      - run: node tools/build-p1.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/p2/browser-p2.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          EXPECTED_PLATFORM: linux
          EXPECTED_ARCH: x64
          OFU_NORMALIZATION_TEST_PATH: .unicode/NormalizationTest.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        with:
          name: p2-linux-${{ matrix.browser }}
          path: dist/evidence/p2-*.json

  platform:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
            platform: win32
            arch: x64
          - os: macos-latest
            browser: webkit
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Fetch official Unicode 15.1 normalization data
        run: node tools/fetch-p2-unicode-test-data.mjs normalization
      - run: node tools/build-p1.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - run: node tests/p2/browser-p2.mjs
        env:
          BROWSER: ${{ matrix.browser }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          OFU_NORMALIZATION_TEST_PATH: .unicode/NormalizationTest.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        with:
          name: p2-${{ matrix.os }}-${{ matrix.browser }}
          path: dist/evidence/p2-*.json

  aggregate:
    if: ${{ always() && needs.route.outputs.run == 'true' }}
    needs:
      - route
      - oracle-and-build
      - browser
      - platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Require upstream success
        shell: bash
        run: |
          test '${{ needs.oracle-and-build.result }}' = success
          test '${{ needs.browser.result }}' = success
          test '${{ needs.platform.result }}' = success
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 / Node 24 runtime
        with:
          pattern: p2-*
          path: collected
      - run: node tools/aggregate-p2-evidence.mjs collected
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        if: always()
        with:
          name: p2-aggregate
          path: dist/p2-aggregate.json
