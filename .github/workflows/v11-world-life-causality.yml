name: V1.1 World Life Causality
on:
  push:
    branches:
      - automation/ofu-world-life-causal-niches-2026-09-06
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/ecology/causal-niche.js'
      - 'src/domains/v1/planetology/causality-trace.js'
      - 'tests/v1/ecology/causal-niche.mjs'
      - 'config/components/v11-world-life-causality.json'
      - 'src/domains/v1/convergence/world-context.js'

permissions:
  contents: read

concurrency:
  group: v11-world-life-causality-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  causal-niche:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/ecology/causal-niche.js
          node --check tests/v1/ecology/causal-niche.mjs
      - name: Causal niche oracle
        run: node tests/v1/ecology/causal-niche.mjs
      - name: Component descriptor integration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {planComponents} from './tools/extensions/components.mjs';
          const actual=JSON.parse(fs.readFileSync('config/components/v11-world-life-causality.json','utf8')).components[0];
          const dep=(id,source)=>({id,version:'1.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source,dependencies:[],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:[id]});
          const plan=planComponents([
            dep('v1.convergence.world-context','src/domains/v1/convergence/world-context.js'),
            dep('v1.models.planetology.causality-trace','src/domains/v1/planetology/causality-trace.js'),
            actual
          ]);
          if(!plan.some(x=>x.id==='v1.ecology.causal-niche'))throw new Error('causal niche component missing');
          console.log(JSON.stringify({status:'PASS',component:'v1.ecology.causal-niche',planned:plan.length}));
          NODE
