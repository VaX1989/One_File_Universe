name: V1.1 World Life Causality
on:
  push:
    branches:
      - automation/ofu-world-life-causal-niches-2026-09-06
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/ecology/causal-niche.js'
      - 'src/domains/v1/planetology/causality-trace.js'
      - 'tests/v1/ecology/causal-niche.mjs'
      - 'config/components/v11-world-life-causality.json'
      - 'src/domains/v1/convergence/world-context.js'
jobs:
  causal-niche:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Syntax
        run: |
          node --check src/domains/v1/ecology/causal-niche.js
          node --check tests/v1/ecology/causal-niche.mjs
      - name: Causal niche oracle
        run: node tests/v1/ecology/causal-niche.mjs
      - name: Component graph integration
        run: node --input-type=module -e "import {loadComponents} from './tools/extensions/components.mjs'; const p=loadComponents(); if(!p.some(x=>x.id==='v1.ecology.causal-niche')) throw new Error('causal niche component missing'); console.log(JSON.stringify({status:'PASS',components:p.length}));"
