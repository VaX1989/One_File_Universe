name: P5 Controlled Promotion

on:
  push:
    branches:
      - feature/p5-controlled-promotion
  pull_request:

concurrency:
  group: p5-controlled-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Foundation
        run: node tools/validate-foundation.mjs
      - name: P1
        run: node tests/run-node-tests.mjs && node tests/p1/portable-save-size.mjs
      - name: P2
        run: npm run test:p2
      - name: P3
        run: node tools/p3-evidence.mjs && python3 tools/p3_spatial_oracle.py
      - name: P4
        run: node tests/p4/run-p4-tests.mjs && node tests/p4/semantic-closure-tests.mjs && node tests/p4/archive-lineage-tests.mjs && node tests/p4/checkpoint-authority-tests.mjs
      - name: Frozen upstream integration
        run: node tests/integration/p2-p4-contract-tests.mjs && node tests/integration/p3-p4-contract-tests.mjs
      - name: P5 conformance
        run: node tests/p5/run-p5-conformance.mjs
      - name: Real P3 v1 to P5 integration
        run: node tests/integration/p3-p5-contract-tests.mjs
      - name: Evidence isolation
        run: node tests/integration/evidence-isolation-generic.mjs
      - name: Build P5 candidate twice and compare
        shell: bash
        run: |
          node tools/build-ofu-p5.mjs > /tmp/p5-build-first.json
          cp dist/One_File_Universe.html /tmp/One_File_Universe.p5.first.html
          cp dist/p5-build-manifest.json /tmp/p5-build-manifest.first.json
          node tools/build-ofu-p5.mjs > /tmp/p5-build-second.json
          cmp /tmp/One_File_Universe.p5.first.html dist/One_File_Universe.html
          cmp /tmp/p5-build-manifest.first.json dist/p5-build-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-candidate-build-${{ env.OFU_SOURCE_SHA }}
          path: |
            dist/One_File_Universe.html
            dist/p5-build-manifest.json

  browser-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-p5.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise shipped P5 candidate from file URL
        run: node tests/p5/browser-p5.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-linux-x64-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p5/

  browser-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: macos-latest
            browser: webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-p5.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - name: Exercise shipped P5 candidate from file URL
        run: node tests/p5/browser-p5.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p5/

  seal:
    if: ${{ always() }}
    needs: [exact-head, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require every P5 gate
        shell: bash
        run: |
          test '${{ needs.exact-head.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
      - uses: actions/download-artifact@v4
        with:
          pattern: p5-*-x64-*-${{ env.OFU_SOURCE_SHA }}
          path: evidence
          merge-multiple: true
      - name: Require one cross-runtime canonical result
        shell: bash
        run: |
          count=$(find evidence -name 'browser-*.json' -type f | wc -l)
          test "$count" -eq 5
          test "$(jq -r '.status' evidence/browser-*.json | sort -u)" = PASS
          test "$(jq -r '.physicalDigest' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.terrainDigest' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          test "$(jq -r '.artifactSha256' evidence/browser-*.json | sort -u | wc -l)" -eq 1
          echo 'P5 controlled promotion exact-head cross-runtime seal PASS'
