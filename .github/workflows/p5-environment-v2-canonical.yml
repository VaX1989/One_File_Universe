name: P5 Environment v2 Canonical Promotion

on:
  push:
    branches:
      - feature/p5-environment-v2-canonical
      - main
      - 'development/v1.*'
    paths:
      - 'src/domains/planetology/p5-environment-v2.js'
      - 'tests/p5-environment-v2/**'
      - 'tests/vectors/golden-p5-environment-v2-corpus.json'
      - 'tools/p5_environment_v2_oracle.py'
      - 'tools/build-ofu-p5-environment-v2.mjs'
      - 'tools/ci/verify-browser-evidence-matrix.mjs'
      - 'tests/governance/browser-evidence-matrix-seal.mjs'
      - 'docs/p5-environment-v2/**'
      - 'docs/adr/**'
      - 'tests/governance/adr-hygiene.mjs'
      - 'docs/ROADMAP.md'
      - 'docs/INTEGRATION_MATRIX.md'
      - '.github/workflows/p5-environment-v2-canonical.yml'
  pull_request:

concurrency:
  group: p5-env-v2-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.phase-gate.outputs.run }}
      adapter_status: ${{ steps.phase-gate.outputs.adapter_status }}
      fail_closed: ${{ steps.phase-gate.outputs.fail_closed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Route historical P5 Environment v2 evidence
        id: phase-gate
        shell: bash
        env:
          OFU_BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          OFU_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci/phase-gate.mjs --phases P5 --base-ref "$OFU_BASE_REF" --base-sha "$OFU_BASE_SHA" --head-sha "$OFU_SOURCE_SHA"

  exact-head:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with: {ref: '${{ env.OFU_SOURCE_SHA }}'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # Node 24 runtime
        with: {python-version: '3.13.15'}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Browser evidence matrix verifier regressions
        run: node tests/governance/browser-evidence-matrix-seal.mjs
      - name: Foundation P1 P2
        run: node tools/validate-foundation.mjs && node tests/run-node-tests.mjs && node tests/p1/portable-save-size.mjs && npm run test:p2
      - name: ADR governance hygiene
        run: node tests/governance/adr-hygiene.mjs
      - name: P3
        run: node tools/p3-evidence.mjs && python3 tools/p3_spatial_oracle.py
      - name: P4
        run: node tests/p4/run-p4-tests.mjs && node tests/p4/semantic-closure-tests.mjs && node tests/p4/archive-lineage-tests.mjs && node tests/p4/checkpoint-authority-tests.mjs
      - name: Frozen P5 v1
        run: node tests/p5/run-p5-conformance.mjs && node tests/integration/p3-p5-contract-tests.mjs
      - name: Environment v2 conformance and Golden corpus
        run: node tests/p5-environment-v2/run-environment-v2-conformance.mjs
      - name: Independent Python oracle
        run: python3 tools/p5_environment_v2_oracle.py
      - name: Sparse working-set benchmark
        shell: bash
        run: |
          mkdir -p dist/evidence/p5-environment-v2
          node --expose-gc tests/p5-environment-v2/benchmark-environment-v2.mjs | tee dist/evidence/p5-environment-v2/node-performance.json
      - name: Evidence isolation
        run: node tests/integration/evidence-isolation-generic.mjs
      - name: Reproducible Environment v2 single-file build
        shell: bash
        run: |
          node tools/build-ofu-p5-environment-v2.mjs > /tmp/build-first.json
          cp dist/One_File_Universe.html /tmp/One_File_Universe.first.html
          cp dist/p5-environment-v2-build-manifest.json /tmp/build-manifest.first.json
          node tools/build-ofu-p5-environment-v2.mjs > /tmp/build-second.json
          cmp /tmp/One_File_Universe.first.html dist/One_File_Universe.html
          cmp /tmp/build-manifest.first.json dist/p5-environment-v2-build-manifest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        with:
          name: p5-env-v2-build-${{ env.OFU_SOURCE_SHA }}
          path: |
            dist/One_File_Universe.html
            dist/p5-environment-v2-build-manifest.json
            dist/evidence/p5-environment-v2/node-performance.json

  browser-linux:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, firefox, webkit]}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with: {ref: '${{ env.OFU_SOURCE_SHA }}'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-p5-environment-v2.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/p5-environment-v2/browser-environment-v2.mjs
        env: {BROWSER: '${{ matrix.browser }}'}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        if: always()
        with:
          name: p5-env-v2-linux-x64-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p5-environment-v2/

  browser-platform:
    needs: route
    if: ${{ needs.route.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, browser: chromium}
          - {os: macos-latest, browser: webkit}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with: {ref: '${{ env.OFU_SOURCE_SHA }}'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - run: node tools/build-ofu-p5-environment-v2.mjs
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install ${{ matrix.browser }}
      - run: node tests/p5-environment-v2/browser-environment-v2.mjs
        env: {BROWSER: '${{ matrix.browser }}'}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 / Node 24 runtime
        if: always()
        with:
          name: p5-env-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ env.OFU_SOURCE_SHA }}
          path: dist/evidence/p5-environment-v2/

  seal:
    if: ${{ always() && needs.route.outputs.run == 'true' }}
    needs: [route, exact-head, browser-linux, browser-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Environment v2 gate
        shell: bash
        run: |
          test '${{ needs.exact-head.result }}' = success
          test '${{ needs.browser-linux.result }}' = success
          test '${{ needs.browser-platform.result }}' = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # Node 24 runtime
        with: {node-version: '24.20.0'}
      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7 / Node 24 runtime
        with:
          pattern: p5-env-v2-*-${{ env.OFU_SOURCE_SHA }}
          path: evidence
          merge-multiple: true
      - name: Require bounded exact-source cross-runtime browser evidence
        run: node tools/ci/verify-browser-evidence-matrix.mjs --mode p5-environment-v2 --root evidence --source-sha "$OFU_SOURCE_SHA"
