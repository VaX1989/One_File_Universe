name: Wave A Convergence Development
on:
  push:
    branches: [integration/v1-wave-a-world-convergence-2026-09-05]
concurrency:
  group: wave-a-world-convergence
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.20.0'}
      - name: Verify and integrate pinned Wave A inputs
        id: source
        env:
          EXPECTED_SOURCE: '${{ github.sha }}'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/integration/v1-wave-a-world-convergence-2026-09-05
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync as run} from 'node:child_process';
          const git=(...args)=>run('git',args,{encoding:'utf8'}).trim();
          const base='a1a77f66bb617415db956366b295c45d316945b1';
          const baseTree='1179192337886b9a7c9042b5eb816485eca78153';
          if(git('rev-parse',`${base}^{tree}`)!==baseTree)throw Error('Frozen base tree mismatch');
          const inputs=[
            ['planetology-environment','54c4f64496e111dec092d940414098749ce45fc0'],
            ['life-evolution','98a35b72ebee2febc9ec1ef6ecb21f2402d1144b'],
            ['civilization-history','7faeae2780d0413b95f2e7996dc4a9bc5c863553'],
            ['microscopic-reality','fec8566ea367ab9bf14042d199e8b9cfc82ce20b'],
            ['universal-exploration','79239193513b582bfa7b2ed37ceca9316bb52417'],
            ['world-rendering','1f077a706e4b9e3eaceccb82c4a632d623c57b80']
          ];
          const lanes=inputs.map(([name,sha])=>{
            const branch=`parallel/v1-wave-a-${name}-2026-09-05`;
            git('fetch','origin',branch);
            const live=git('rev-parse','FETCH_HEAD');
            if(live!==sha)throw Error(`Lane moved: ${branch} expected ${sha} got ${live}`);
            git('merge-base','--is-ancestor',base,sha);
            return {name,branch,sha,tree:git('rev-parse',`${sha}^{tree}`)};
          });
          const record={schema:'OFU_WAVE_A_INPUTS_V1',base:{sha:base,tree:baseTree},preservedDefinitiveHead:'9dac1888668fb0a3bafb6fb77c9624a62205f064',lanes};
          console.log('VERIFIED_INPUTS_BEFORE_INTEGRATION',JSON.stringify(record,null,2));
          fs.writeFileSync('/tmp/wave-a-inputs.json',JSON.stringify(record,null,2)+'\n');
          for(const lane of lanes){
            let included=false;
            try{git('merge-base','--is-ancestor',lane.sha,'HEAD');included=true;}catch{}
            if(!included)console.log(git('merge','--no-ff','--no-edit',lane.sha,'-m',`wave-a: integrate ${lane.name} at ${lane.sha}`));
          }
          fs.mkdirSync('docs/integration',{recursive:true});
          fs.copyFileSync('/tmp/wave-a-inputs.json','docs/integration/wave-a-inputs.json');
          git('add','docs/integration/wave-a-inputs.json');
          if(git('diff','--cached','--name-only'))git('commit','-m','wave-a: record verified six-lane input provenance');
          git('push','origin','HEAD:refs/heads/integration/v1-wave-a-world-convergence-2026-09-05');
          const sha=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}');
          console.log('CONVERGENCE_CHECKPOINT',sha,tree);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`sha=${sha}\ntree=${tree}\n`);
          NODE
      - name: Build early production single-file artifact
        run: |
          node tools/build-ofu-rendering-v09.mjs
          cp dist/One_File_Universe.html dist/One_File_Universe-v1-wave-a-playable.html
          sha256sum dist/One_File_Universe-v1-wave-a-playable.html
          wc -c dist/One_File_Universe-v1-wave-a-playable.html
      - name: Run domain and integration development tests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const files=walk('tests/v1').filter(f=>f.endsWith('.mjs')&&!path.basename(f).startsWith('browser-')&&path.basename(f)!=='run.mjs').sort();
          const results=[];
          for(const file of files){const p=spawnSync(process.execPath,[file],{encoding:'utf8',timeout:120000,maxBuffer:8000000});console.log(`\nTEST ${file}\n${p.stdout||''}${p.stderr||''}`);results.push({file,status:p.status,signal:p.signal,error:p.error?.message});}
          fs.mkdirSync('reports/wave-a',{recursive:true});fs.writeFileSync('reports/wave-a/development-tests.json',JSON.stringify(results,null,2)+'\n');
          const failed=results.filter(r=>r.status!==0);console.log('DEVELOPMENT_SUMMARY',JSON.stringify({total:results.length,failed}));if(failed.length)process.exit(1);
          NODE
      - name: Preserve exact source and diagnostics
        if: always()
        run: |
          mkdir -p wave-a-evidence
          git rev-parse HEAD > wave-a-evidence/source-sha.txt
          git rev-parse 'HEAD^{tree}' > wave-a-evidence/source-tree.txt
          git status --short > wave-a-evidence/worktree-status.txt
          git archive --format=tar.gz -o wave-a-evidence/wave-a-source.tar.gz HEAD
          git bundle create wave-a-evidence/wave-a-history.bundle HEAD
          cp /tmp/wave-a-inputs.json wave-a-evidence/ 2>/dev/null || true
          cp -r dist wave-a-evidence/ 2>/dev/null || true
          cp -r reports/wave-a wave-a-evidence/reports 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wave-a-development-${{ github.run_id }}
          path: wave-a-evidence/
          retention-days: 7
