name: V1.1 World Molecular Stoichiometry
on:
  push:
    branches:
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/molecular/stoichiometric-reference.js'
      - 'tests/v1/molecular/stoichiometric-reference.mjs'
      - 'config/components/v11-molecular-stoichiometry.json'
      - '.github/workflows/v11-world-molecular-stoichiometry.yml'

permissions:
  contents: read

concurrency:
  group: v11-world-molecular-stoichiometry-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  molecular-stoichiometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/molecular/stoichiometric-reference.js
          node --check tests/v1/molecular/stoichiometric-reference.mjs
      - name: Existing molecular reference oracle
        run: node tests/v1/molecular/reference-mass.mjs
      - name: Molecular stoichiometric oracle
        run: node tests/v1/molecular/stoichiometric-reference.mjs
      - name: Live component graph integrity
        run: node tests/extensions/components.mjs
      - name: Workflow reproducibility guard
        run: node tests/governance/workflow-reproducibility.mjs
