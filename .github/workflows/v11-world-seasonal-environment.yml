name: V1.1 World Seasonal Environment
on:
  push:
    branches:
      - development/v1.1-quality-exploration
  pull_request:
    paths:
      - 'src/domains/v1/environment/seasonal-envelope.js'
      - 'tests/v1/environment/seasonal-envelope.mjs'
      - 'config/components/v11-seasonal-environment.json'
      - '.github/workflows/v11-world-seasonal-environment.yml'

permissions:
  contents: read

concurrency:
  group: v11-world-seasonal-environment-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  OFU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  seasonal-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 / Node 24 runtime
        with:
          ref: ${{ env.OFU_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node 24 runtime
        with:
          node-version: '24.20.0'
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$OFU_SOURCE_SHA"
      - name: Syntax
        run: |
          node --check src/domains/v1/environment/seasonal-envelope.js
          node --check tests/v1/environment/seasonal-envelope.mjs
      - name: Existing environment oracle
        run: node tests/v1/environment/world-system.mjs
      - name: Seasonal environment oracle
        run: node tests/v1/environment/seasonal-envelope.mjs
      - name: Component descriptor integration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {planComponents} from './tools/extensions/components.mjs';
          const actual=JSON.parse(fs.readFileSync('config/components/v11-seasonal-environment.json','utf8')).components[0];
          const dep={id:'v1.convergence.world-context',version:'1.0.0',owner:'v1',kind:'code',stage:'foundation',placement:'script',source:'src/domains/v1/convergence/world-context.js',dependencies:[],authority:'MODEL_DERIVED_SIMULATION',provenance:'validation dependency',provides:['v1.convergence.world-context']};
          const plan=planComponents([dep,actual]);
          if(!plan.some(x=>x.id==='v1.environment.seasonal-envelope'))throw new Error('seasonal environment component missing');
          console.log(JSON.stringify({status:'PASS',component:'v1.environment.seasonal-envelope',planned:plan.length}));
          NODE
      - name: Workflow reproducibility guard
        run: node tests/governance/workflow-reproducibility.mjs
