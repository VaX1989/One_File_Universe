name: P1 Conformance
on:
  push:
    branches: ['feature/p1-constitutional-prototype']
  pull_request:
permissions:
  contents: read
jobs:
  node-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: p1-build
          path: dist/
  browser-direct-open:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node tools/build-p1.mjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node tests/browser/direct-open.mjs
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-browser-${{ matrix.browser }}
          path: dist/evidence/
